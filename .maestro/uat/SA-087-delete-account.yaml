# UAT SA-087: a helper who is still employed can't ask to delete her account
# yet (KNOWN_GAPS.md O55): she's told to give notice first, the employer ends
# the employment, then she deletes. No request is made. Test helper (employed).
appId: com.linara.mobile
name: SA-087 Ask to delete the account
tags: [uat, helper]
---
- runFlow: ../common/sign-in-staff.yaml
- tapOn: "Record ko"
- scrollUntilVisible:
    element: "Burahin ang account ko"
- tapOn: "Burahin ang account ko"
- scrollUntilVisible:
    element: "May trabaho ka pa, kaya hindi pa mabubura ang account mo.*"
- assertVisible: "1. Magbigay ng abiso sa employer mo.*"
- assertVisible: "3. Bumalik dito at burahin ang account mo."
# No way to send the request from here.
- assertNotVisible: "Bakit\\? \\(optional\\)"
- takeScreenshot: SA-087-employed
- scrollUntilVisible:
    element: "Sige"
- tapOn: "Sige"
- assertNotVisible: "Huwag nang burahin"
