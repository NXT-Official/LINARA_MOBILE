# UAT SA-006: sign in, sign out, then a wrong password. Test helper account.
appId: com.linara.mobile
name: SA-006 Sign in and wrong password
tags: [uat, helper]
---
- runFlow: ../common/sign-in-staff.yaml
- assertVisible: "Station ni .*"
- tapOn: "Record ko"
- scrollUntilVisible:
    element: "Mag-sign out"
- tapOn: "Mag-sign out"
- assertVisible: "Sigurado ka?.*"
# The confirm row replaces the first button, keeping its label.
- tapOn: "Mag-sign out"
- extendedWaitUntil:
    visible: "Maligayang pagbabalik"
    timeout: 20000
- tapOn: "hal. rosa@gmail.com"
- inputText: ${MAESTRO_STAFF_EMAIL}
- tapOn: "••••••"
- inputText: "wrong-password-1"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Mali ang email o password. Subukan ulit, po."
    timeout: 20000
