# Sets a time in the manager WebView's time dialog (an <input type="time">)
# by typing it: FIELD=<field text> HOUR=<1-12> MINUTE=<00-59> AMPM=AM|PM.
# Like set-time.yaml, but this dialog confirms with SET, not OK.
appId: com.linara.mobile
---
- scrollUntilVisible:
    element: ${FIELD}
    centerElement: true
- tapOn: ${FIELD}
# AM/PM first, while the dialog is still on the clock face.
- tapOn: ${AMPM}
- tapOn: "Switch to text input mode for the time input."
- tapOn:
    id: "android:id/input_hour"
- eraseText: 2
- inputText: ${HOUR}
- tapOn:
    id: "android:id/input_minute"
- eraseText: 2
- inputText: ${MINUTE}
- tapOn: "SET"
- waitForAnimationToEnd
